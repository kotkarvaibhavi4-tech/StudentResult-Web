<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Management System</h1>

        <div class="form">

            <label>Student Name:</label>
            <input type="text" id="name" placeholder="Enter student name">

            <label>Roll Number:</label>
            <input type="text" id="roll" placeholder="Enter roll number">

            <label>Subject 1:</label>
            <input type="number" id="marks1" placeholder="Enter marks">

            <label>Subject 2:</label>
            <input type="number" id="marks2" placeholder="Enter marks">

            <label>Subject 3:</label>
            <input type="number" id="marks3" placeholder="Enter marks">

            <label>Subject 4:</label>
            <input type="number" id="marks4" placeholder="Enter marks">

            <label>Subject 5:</label>
            <input type="number" id="marks5" placeholder="Enter marks">

            <button onclick="addStudent()">Add Student</button>

        </div>

        <h2>Student Records</h2>

        <table id="studentTable">

            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Subject 1</th>
                    <th>Subject 2</th>
                    <th>Subject 3</th>
                    <th>Subject 4</th>
                    <th>Subject 5</th>
                    <th>Total</th>
                    <th>Percentage</th>
                </tr>
            </thead>

            <tbody id="tableBody">
            </tbody>

        </table>

        <h2 id="topper">Topper: -</h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
